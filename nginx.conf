# nginx config TEMPLATE: the nginx image fills in ${...} values from environment variables at start-up
# (copied to /etc/nginx/templates/default.conf.template in the Dockerfile).
#
#   BACKEND_URL            Where /api requests are forwarded, e.g. http://backend:8000 (docker compose)
#                          or https://your-backend.onrender.com. Default set in the Dockerfile.
#   BACKEND_FALLBACK_URL   Tried when BACKEND_URL can't be reached. Default http://host.docker.internal:8000,
#                          i.e. a backend container published on host port 8000 (Docker Desktop).
#   NGINX_LOCAL_RESOLVERS  Set automatically by the nginx image from /etc/resolv.conf.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend's name per request (not once at start-up), so the site still starts
    # when the backend isn't up yet, and picks up the backend if it restarts with a new IP.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Security headers (keep in sync with vercel.json). Inherited by every location below,
    # as long as a location doesn't declare add_header itself.
    #   CSP: scripts only from this site (no inline scripts), Google Fonts for the font,
    #   API calls to this site, blob: for the PDF preview, and the page can't be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Keeps the password reset token in /reset-password?token=... from leaking to other sites
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only takes effect when the site is served over HTTPS (e.g. behind a TLS proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        set $backend_upstream "${BACKEND_URL}";
        # With a variable and no URI part, the original request path (/api/...) is passed through as-is
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Needed for HTTPS backends (e.g. Render) that pick the site by TLS server name
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, so clients can't fake their IP
        proxy_set_header X-Forwarded-Proto $scheme;

        # If BACKEND_URL can't be reached (e.g. no container named "backend" because the containers were
        # started separately with Docker Desktop's Run button), try BACKEND_FALLBACK_URL instead.
        # Only errors nginx itself produces (name not found, connection refused) trigger this;
        # error responses from a running backend are passed through unchanged.
        error_page 502 504 = @backend_fallback;
    }

    location @backend_fallback {
        set $backend_fallback "${BACKEND_FALLBACK_URL}";
        proxy_pass $backend_fallback;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, so clients can't fake their IP
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
